    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="canonical" href="https://vortura.ai/" />
    <!-- Prerendered pages carry static markup for crawlers. Visitors with
         JavaScript get the live app instead, so keep the static copy hidden
         until main.tsx swaps it out; it would otherwise flash, vanish, and
         animate back in. Without JavaScript the rule never applies. -->
    <script>document.documentElement.setAttribute("data-js", "")</script>
    <style>[data-js] #root[data-prerendered] { visibility: hidden; }</style>
    <meta name="google-site-verification" content="nycjx_6wYEgHv0KjcYP8cH5xpgovff4y9WXQ570T6Bw" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the weights actually used (400/500/600/700). Loaded async via the
         media="print" swap so fonts never block first render. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"

    </noscript>
